name: Checks

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "lib.typ"
      - "examples/**"
      - "tests/**"
      - "typst.toml"
      - "tools/**"
      - "README.md"
      - "LICENSE"
      - ".github/actions/**"
      - ".github/workflows/checks.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "lib.typ"
      - "examples/**"
      - "tests/**"
      - "typst.toml"
      - "tools/**"
      - "README.md"
      - "LICENSE"
      - ".github/actions/**"
      - ".github/workflows/checks.yml"

permissions:
  contents: read

# One active run per branch; cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typst-compile:
    name: Compile Typst sources
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Typst version from typst.toml
        id: typst-version
        uses: ./.github/actions/typst-version

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      - name: Compile unit tests
        id: unit
        uses: ./.github/actions/typst-compile
        with:
          label: unit
          glob: "tests/unit/*.typ"

      - name: Compile examples
        id: examples
        if: always()
        uses: ./.github/actions/typst-compile
        with:
          label: example
          glob: "examples/*.typ"

      # Cases that must fail. A guard cannot be exercised from inside a unit
      # test, because Typst cannot catch a panic, so these compile files that
      # are asserted to fail and match the recorded message.
      - name: Run expect-fail cases
        id: expect-fail
        if: always()
        shell: bash
        run: tools/expect-fail.sh

      # Cases that must compile and warn. A compile that warns is a failure
      # everywhere else, so nothing else reaches that rule: the unit tests
      # compile silently and an expect-fail case never exits zero.
      - name: Run expect-warn cases
        id: expect-warn
        if: always()
        shell: bash
        run: tools/expect-warn.sh

      - name: Summary
        if: always()
        shell: bash
        env:
          EXPECT_FAIL_OUTCOME: ${{ steps.expect-fail.outcome }}
          EXPECT_WARN_OUTCOME: ${{ steps.expect-warn.outcome }}
          UNIT_PASSED: ${{ steps.unit.outputs.passed }}
          UNIT_TOTAL: ${{ steps.unit.outputs.total }}
          UNIT_FAILED: ${{ steps.unit.outputs.failed }}
          UNIT_FAILURES: ${{ steps.unit.outputs.failures }}
          EXAMPLES_PASSED: ${{ steps.examples.outputs.passed }}
          EXAMPLES_TOTAL: ${{ steps.examples.outputs.total }}
          EXAMPLES_FAILED: ${{ steps.examples.outputs.failed }}
          EXAMPLES_FAILURES: ${{ steps.examples.outputs.failures }}
        run: |
          set -euo pipefail
          render_section() {
            local title="$1" passed="$2" total="$3" failed="$4" failures="$5"
            passed="${passed:-0}"
            total="${total:-0}"
            failed="${failed:-0}"
            echo ""
            echo "### ${title}"
            if [[ "${failed}" -gt 0 ]]; then
              echo "- Status: failed (${passed}/${total})"
              echo ""
              echo "#### Failures"
              while IFS= read -r line; do
                [[ -n "${line}" ]] && echo "- \`${line}\`"
              done <<< "${failures}"
            else
              echo "- Status: passed (${passed}/${total})"
            fi
          }
          {
            echo "## Typst compile"
            render_section "Unit tests" "${UNIT_PASSED}" "${UNIT_TOTAL}" "${UNIT_FAILED}" "${UNIT_FAILURES}"
            render_section "Examples" "${EXAMPLES_PASSED}" "${EXAMPLES_TOTAL}" "${EXAMPLES_FAILED}" "${EXAMPLES_FAILURES}"
            echo ""
            echo "### Expect-fail cases"
            echo "- Status: ${EXPECT_FAIL_OUTCOME:-skipped}"
            echo ""
            echo "### Expect-warn cases"
            echo "- Status: ${EXPECT_WARN_OUTCOME:-skipped}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # The reference documentation is generated from the /// comments in src/, so a
  # malformed comment is a build failure rather than a page that says nothing.
  # This job runs the generator's own tests and then parses the real sources.
  #
  # `docs/**` is deliberately absent from this workflow's paths: the site render
  # in pages.yml runs the same generator through the Quarto pre-render, so a
  # documentation-only commit is checked there rather than compiling Typst here
  # for no reason.
  typstdoc:
    name: Check documentation comments
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      - name: Run typstdoc tests
        shell: bash
        run: |
          set -euo pipefail
          lua tools/typstdoc/test/run.lua

      - name: Parse the doc comments
        shell: bash
        run: |
          set -euo pipefail
          lua tools/typstdoc/main.lua --check --strict

  # What a slide looks like, which no structural assertion can see. One golden
  # per page of every deck under examples/.
  visual-snapshots:
    name: Compare visual snapshots
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Typst version from typst.toml
        id: typst-version
        uses: ./.github/actions/typst-version

      # The pinned version, not the newest, because a golden is a rendering and
      # a different compiler renders differently. This is the same pin the
      # compile job installs.
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      - name: Compare against the goldens
        uses: ./.github/actions/typst-snapshot
        with:
          mode: check

  shell-checks:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck tools/*.sh

      - name: Set up shfmt
        uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: 3.13.1

      - name: Run shfmt
        shell: bash
        run: |
          set -euo pipefail
          shfmt -d tools/*.sh
